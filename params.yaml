collect_kfac:
  sample_labels: true
  args:
    device: cuda
    dtype: bfloat16
    corpus: dolmo
    nbytes: 100000000
    seq_len: 512
    target_blocks:
    - '23'
    - '24'
    - '25'
    layers_per_pass: 3
    batch_size: 36
    method: kfac
    calibration_mix: dolmino_50B
  script: data/collect_kfac_bergson.py
  extra_dep: pyproject.toml
  fsdp: true
  world_size: 8
  bf16_batch_size: 40
eval_kfac:
  use_weight_coefficients: true
  use_wanda: false
  use_foof: false
  use_marginal_corrections: false
  corrections_from: ''
  start_from_model: /home/guillaume/memorization_kfac/out/aux/model_privnoise_90/model
  corrections_side: ''
  args:
    layers-json: '{"23": {"gate": 1.0, "up": 1.0, "down": 1.0}, "24": {"gate": 1.0,
      "up": 1.0, "down": 1.0}, "25": {"gate": 1.0, "up": 1.0, "down": 1.0}}'
    bs: 96
    bergson-factors: out/collect_kfac/bergson/7b
  use_eigenvalue_corrections: true
band_activations:
  datasets:
    gsm8k:
      hf_path: gsm8k
      hf_config: main
      split: train
      column: question
    winogrande:
      hf_path: winogrande
      hf_config: winogrande_xl
      split: train
      column: sentence
    pile10k:
      hf_path: NeelNanda/pile-10k
      split: train
      column: text
  args:
    target_blocks:
    - '23'
    - '24'
    - '25'
    projection: up
    n_samples: 128
    batch_size: 4
    seq_len: 512
    datasets_json: '{"gsm8k": {"hf_path": "gsm8k", "hf_config": "main", "split": "train",
      "column": "question"}, "winogrande": {"hf_path": "winogrande", "hf_config":
      "winogrande_xl", "split": "train", "column": "sentence"}, "pile10k": {"hf_path":
      "NeelNanda/pile-10k", "split": "train", "column": "text"}}'
mask_intersection:
  args:
    layers_json: '{"23": {"gate": 1.0, "up": 1.0, "down": 1.0}, "24": {"gate": 1.0,
      "up": 1.0, "down": 1.0}, "25": {"gate": 1.0, "up": 1.0, "down": 1.0}}'
out_suffix: bergson/7b
out_dir:
  prepare_pile10k: data/pile10k_None.txt
  prepare_pile10k_cache: out/prepare_pile10k_cache
  baseline_cache: out/baseline_cache/7b
  collect_kfac: out/collect_kfac/bergson/7b
  eval_kfac: out/eval_kfac/bergson/7b
  mask_intersection: out/mask_intersection/bergson/7b
  band_activations: out/band_activations/bergson/7b
  plot_figure2: out/plot_figure2/bergson/7b
  benchmark: out/benchmark/bergson/7b
computed:
  eigenvalue_corrections_flag: --eigenvalue-corrections
  weight_coefficients_flag: --weight-coefficients
  wanda_flag: ''
  foof_flag: ''
  marginal_corrections_flag: ''
  corrections_from_flag: ''
  start_from_model_flag: --start-from-model /home/guillaume/memorization_kfac/out/aux/model_privnoise_90/model
  corrections_side_flag: ''
  sample_labels_flag: --sample_labels
  fsdp_flag: --fsdp
  world_size_flag: --world_size 8
model:
  name: allenai/OLMo-2-1124-7B
  size: 7b
  layer_mass:
    gate: 1.0
    up: 1.0
    down: 1.0
  layers:
    '23':
      gate: 1.0
      up: 1.0
      down: 1.0
    '24':
      gate: 1.0
      up: 1.0
      down: 1.0
    '25':
      gate: 1.0
      up: 1.0
      down: 1.0
method:
  name: bergson
benchmark:
  args:
    task: gsm8k::olmes
    batch-size: 28
model_method:
  gate_up_mass: 1.0
