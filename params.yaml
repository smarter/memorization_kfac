model:
  name: allenai/OLMo-2-1124-7B
  size: 7b
  layer_mass:
    gate: 0.4
    up: 0.4
    down: 1.0
  layers:
    '23':
      gate: 0.4
      up: 0.4
      down: 1.0
    '24':
      gate: 0.4
      up: 0.4
      down: 1.0
    '25':
      gate: 0.4
      up: 0.4
      down: 1.0
eval_kfac:
  args:
    bs: 96
    bergson-factors: out/collect_kfac/identity/7b
    layers-json: '{"23": {"gate": 0.4, "up": 0.4, "down": 1.0}, "24": {"gate": 0.4,
      "up": 0.4, "down": 1.0}, "25": {"gate": 0.4, "up": 0.4, "down": 1.0}}'
  use_eigenvalue_corrections: false
  use_weight_coefficients: true
method:
  name: identity
collect_kfac:
  script: data/collect_kfac_identity.py
  extra_dep: data/collect_kfac_identity.py
  fsdp: false
  world_size: null
  bf16_batch_size: 1
  sample_labels: true
  args:
    device: cuda
    dtype: bfloat16
    corpus: dolmo
    nbytes: 100000000
    seq_len: 512
    target_blocks:
    - '23'
    - '24'
    - '25'
    layers_per_pass: 3
    batch_size: 36
benchmark:
  args:
    task: gsm8k::olmes
    batch-size: 26
model_method:
  gate_up_mass: 0.4
band_activations:
  datasets:
    gsm8k:
      hf_path: gsm8k
      hf_config: main
      split: train
      column: question
    winogrande:
      hf_path: winogrande
      hf_config: winogrande_xl
      split: train
      column: sentence
    pile10k:
      hf_path: NeelNanda/pile-10k
      split: train
      column: text
  args:
    target_blocks:
    - '23'
    - '24'
    - '25'
    projection: up
    n_samples: 128
    batch_size: 4
    seq_len: 512
    datasets_json: '{"gsm8k": {"hf_path": "gsm8k", "hf_config": "main", "split": "train",
      "column": "question"}, "winogrande": {"hf_path": "winogrande", "hf_config":
      "winogrande_xl", "split": "train", "column": "sentence"}, "pile10k": {"hf_path":
      "NeelNanda/pile-10k", "split": "train", "column": "text"}}'
mask_intersection:
  args:
    layers_json: '{"23": {"gate": 0.4, "up": 0.4, "down": 1.0}, "24": {"gate": 0.4,
      "up": 0.4, "down": 1.0}, "25": {"gate": 0.4, "up": 0.4, "down": 1.0}}'
out_suffix: identity/7b
out_dir:
  prepare_pile10k: data/pile10k_None.txt
  prepare_pile10k_cache: out/prepare_pile10k_cache
  baseline_cache: out/baseline_cache/7b
  collect_kfac: out/collect_kfac/identity/7b
  eval_kfac: out/eval_kfac/identity/7b
  mask_intersection: out/mask_intersection/identity/7b
  band_activations: out/band_activations/identity/7b
  plot_figure2: out/plot_figure2/identity/7b
  benchmark: out/benchmark/identity/7b
computed:
  eigenvalue_corrections_flag: ''
  weight_coefficients_flag: --weight-coefficients
  sample_labels_flag: --sample_labels
  fsdp_flag: ''
  world_size_flag: ''
