# @package _global_
method:
  name: "bergson"

collect_kfac:
  script: "data/collect_kfac_bergson.py"
  # pyproject.toml pins the exact bergson commit, so DVC re-runs this stage
  # whenever the pin is bumped.
  extra_dep: "pyproject.toml"
  fsdp: true
  world_size: 8
  args:
    method: "kfac"
    # Default: alphabetical order (legacy bias toward whichever subdomain
    # comes first lexicographically). Override via
    # -S collect_kfac.args.calibration_mix=<strategy>:
    #   shuffle      single random permutation of the shard list (--seed)
    #   interleave   round-robin across top-level subdomain dirs
    #   dolmino_50B  weighted interleave matching AI2's published 50B mix
    #   gsm8k        restrict to data/math/gsm8k/ only (Dolmino)
    # See data/calibration.py.
    calibration_mix: "first_n"

eval_kfac:
  use_eigenvalue_corrections: true
  args:
    bergson-factors: ${out_dir.collect_kfac}
