# @package _global_
method:
  name: "wanda"

# Wanda is a re-interpretation of bergson's activation covariance: the
# saliency synthesis happens at eval time inside eval_mem_kfac.py (--wanda).
# We therefore share collect_kfac outputs with the bergson method — once
# bergson's factors are cached at out/collect_kfac/bergson/<size>, this
# stage is a no-op.
out_dir:
  collect_kfac: "out/collect_kfac/bergson/${model.size}"

collect_kfac:
  script: "data/collect_kfac_bergson.py"
  # pyproject.toml pins the exact bergson commit, so DVC re-runs this stage
  # whenever the pin is bumped.
  extra_dep: "pyproject.toml"
  fsdp: true
  world_size: 8
  args:
    method: "kfac"
    calibration_mix: "first_n"

eval_kfac:
  # --wanda turns on Wanda's saliency synthesis at load time; combine with
  # --weight-coefficients to get the canonical Wanda ranking
  # importance = eva_A * W^2 (= ||X_:,i||_2^2 * W_oi^2 modulo a global per-
  # layer constant). Leaving --weight-coefficients off yields the
  # eva_A-only baseline (uniform across output rows).
  use_wanda: true
  use_weight_coefficients: true
  use_eigenvalue_corrections: false
  args:
    bergson-factors: ${out_dir.collect_kfac}
