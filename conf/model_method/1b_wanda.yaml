# @package _global_
model_method:
  # Mirror the bergson default so wanda is a comparable baseline at the same
  # target compression budget.
  gate_up_mass: 0.40

collect_kfac:
  # Wanda re-uses bergson's collected factors; keep this in sync with
  # conf/model_method/1b_bergson.yaml.
  bf16_batch_size: 168
