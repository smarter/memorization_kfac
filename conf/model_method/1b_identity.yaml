# @package _global_
model_method:
  # Mirror the bergson default so identity is a comparable baseline at the
  # same target compression budget.
  gate_up_mass: 0.40

collect_kfac:
  # Unused by the identity script (it doesn't run any forward/backward pass)
  # but referenced by config.yaml's ${scale_for_dtype:..} expansion.
  bf16_batch_size: 1
