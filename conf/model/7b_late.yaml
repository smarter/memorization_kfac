# @package _global_
# OLMo-2 7B, editing layers 26-28 instead of 23-25 (layer sweep 2026-09-04:
# memorization's flat-input support persists in the late third of the network
# while arithmetic's flat-input dependence is concentrated at layers 20-24).
model:
  name: "allenai/OLMo-2-1124-7B"
  size: "7b"
  layer_mass:
    gate: ${model_method.gate_up_mass}
    up: ${model_method.gate_up_mass}
    down: 1.0
  layers:
    "26": ${..layer_mass}
    "27": ${..layer_mass}
    "28": ${..layer_mass}

eval_kfac:
  args:
    bs: 96 # batch size
