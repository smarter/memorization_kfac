# Hydra configuration for K-FAC experiments
# Usage:
#   dvc exp run -S model=7b -S method=bergson
#   dvc exp run --queue -S 'model=1b,7b' -S 'method=original,bergson'

defaults:
  - _self_
  - model: 7b # loads model/7b.yaml
  - method: bergson
  - benchmark: gsm8k
  - model_method: ${model}_${method} # loads model_method/7b_bergson.yaml

collect_kfac:
  sample_labels: true
  args:
    device: "cuda"
    dtype: "bfloat16"
    corpus: "dolmo"
    nbytes: 100000000  # ~100MB (~20M tokens)
    seq_len: 512
    target_blocks: ${oc.dict.keys:model.layers}
    layers_per_pass: ${len:${model.layers}}
    batch_size: ${scale_for_dtype:${..bf16_batch_size},${.dtype}}

eval_kfac:
  use_weight_coefficients: false
  use_wanda: false
  use_foof: false
  # Replace the full O x I correction matrix by the separable matrix with the
  # same row/column sums (needs use_eigenvalue_corrections: true).
  use_marginal_corrections: false
  args:
    layers-json: ${json:${model.layers}}

band_activations:
  # Per-task activation-band analysis on K-FAC's activation eigenbasis.
  # See evaluations/curvature_band_activations.py.
  datasets:
    gsm8k:
      hf_path: "gsm8k"
      hf_config: "main"
      split: "train"
      column: "question"
    winogrande:
      hf_path: "winogrande"
      hf_config: "winogrande_xl"
      split: "train"
      column: "sentence"
    pile10k:
      hf_path: "NeelNanda/pile-10k"
      split: "train"
      column: "text"
  args:
    target_blocks: ${oc.dict.keys:model.layers}
    projection: "up"
    n_samples: 128
    batch_size: 4
    seq_len: 512
    datasets_json: ${json:${band_activations.datasets}}

mask_intersection:
  # Same pattern: ${json:...} only resolves in conf/.
  args:
    layers_json: ${json:${model.layers}}



# Common output suffix and directories
out_suffix: "${method.name}/${model.size}"
out_dir:
  prepare_pile10k: "data/pile10k_None.txt"
  prepare_pile10k_cache: "out/prepare_pile10k_cache"
  baseline_cache: "out/baseline_cache/${model.size}"
  collect_kfac: "out/collect_kfac/${out_suffix}"
  eval_kfac: "out/eval_kfac/${out_suffix}"
  mask_intersection: "out/mask_intersection/${out_suffix}"
  band_activations: "out/band_activations/${out_suffix}"
  plot_figure2: "out/plot_figure2/${out_suffix}"
  benchmark: "out/benchmark/${out_suffix}"

computed:
  # Flags that cannot be represented as "key: value" because they don't have a
  # value (dvc expands "key: null" as "--key None").
  eigenvalue_corrections_flag: "${if:${eval_kfac.use_eigenvalue_corrections},'--eigenvalue-corrections',''}"
  weight_coefficients_flag: "${if:${eval_kfac.use_weight_coefficients},'--weight-coefficients',''}"
  wanda_flag: "${if:${eval_kfac.use_wanda},'--wanda',''}"
  foof_flag: "${if:${eval_kfac.use_foof},'--foof',''}"
  marginal_corrections_flag: "${if:${eval_kfac.use_marginal_corrections},'--marginal-corrections',''}"
  sample_labels_flag: "${if:${collect_kfac.sample_labels},'--sample_labels',''}"
  fsdp_flag: "${if:${collect_kfac.fsdp},'--fsdp',''}"
  world_size_flag: "${if_set:${collect_kfac.world_size},'--world_size'}"
